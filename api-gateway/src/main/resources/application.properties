spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.routes[0].id=auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=product
spring.cloud.gateway.server.webflux.routes[1].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/admin/products,/admin/products/**,/discounts,/discounts/**,/warehouses,/warehouses/**,/product-variants,/product-variants/**

spring.cloud.gateway.server.webflux.routes[2].id=order
spring.cloud.gateway.server.webflux.routes[2].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/orders,/orders/**,/cart,/cart/**,/returns,/returns/**,/admin/orders,/admin/orders/**

spring.cloud.gateway.server.webflux.routes[3].id=users
spring.cloud.gateway.server.webflux.routes[3].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/users,/users/**,/addresses,/addresses/**

jwt.secret=${JWT_SECRET:dev-only-secret-key-change-in-production-32bytes-min}
